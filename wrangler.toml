name = "sajidmk-gate"
main = "worker.js"
compatibility_date = "2024-11-01"

# Update with the real KV namespace id after running:
#   wrangler kv namespace create GATE_KV
[[kv_namespaces]]
binding = "GATE_KV"
id = "f45bb484abd84240890f19415cb6491a"

[vars]
ALLOWED_ORIGIN = "https://www.sajidmk.com"

