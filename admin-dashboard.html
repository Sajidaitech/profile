<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ================================================================
   ADMIN DASHBOARD — dark glass/silver, built on the portfolio's
   existing design tokens (blur depth, shadow system, amber/silver
   accents, DM Sans) but on a dark enterprise base.
================================================================ */
:root{
  --bg-0:#0a0b0d;
  --bg-1:#111318;
  --bg-2:#181b22;
  --glass-strong: rgba(230,160,86,0.08);
  --glass-mid:    rgba(230,160,86,0.05);
  --glass-line:   rgba(255,255,255,0.08);
  --glass-line-hi:rgba(255,255,255,0.14);
  --blur-strong: blur(20px) saturate(1.4) brightness(1.05);
  --blur-mid:    blur(14px) saturate(1.3);
  --amber:   #E6A056;
  --amber-2: #CD771E;
  --silver:  #D4D8E0;
  --gold:    #D4AF37;
  --good:    #34D399;
  --warn:    #FBBF24;
  --bad:     #F87171;
  --txt-1: #F5F6F8;
  --txt-2: #B7BCC6;
  --txt-3: #7B818E;
  --r-sm: 10px; --r: 14px; --r-lg: 20px;
  --sh-glass:
    inset 0 1px 0 rgba(255,255,255,0.06),
    0 2px 8px rgba(0,0,0,0.35),
    0 12px 30px rgba(0,0,0,0.30);
  --ff: 'DM Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --ff-mono: 'DM Mono', ui-monospace, monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--ff);
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(230,160,86,0.10), transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, rgba(205,119,30,0.08), transparent 55%),
    var(--bg-0);
  color:var(--txt-1);
  min-height:100%;
  -webkit-font-smoothing:antialiased;
}
::selection{ background: rgba(230,160,86,0.35); }

/* ---------- glass panel base ---------- */
.glass{
  background: linear-gradient(180deg, var(--glass-strong), var(--glass-mid)), var(--bg-1);
  border:1px solid var(--glass-line);
  backdrop-filter: var(--blur-mid);
  -webkit-backdrop-filter: var(--blur-mid);
  border-radius: var(--r);
  box-shadow: var(--sh-glass);
}

/* ================================================================
   LOGIN GATE
================================================================ */
#login-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px;
}
.login-card{
  width:100%; max-width:380px; padding:36px 32px;
  text-align:center;
}
.login-card .mark{
  width:44px;height:44px;border-radius:12px;margin:0 auto 18px;
  background: linear-gradient(135deg, var(--amber), var(--amber-2));
  display:flex;align-items:center;justify-content:center;
  font-weight:700; color:#1a1206; font-size:18px;
  box-shadow: 0 6px 20px rgba(230,160,86,0.35);
}
.login-card h1{ font-size:20px; font-weight:700; margin-bottom:6px; }
.login-card p{ font-size:13px; color:var(--txt-3); margin-bottom:24px; }
.login-card input{
  width:100%; padding:13px 14px; border-radius:var(--r-sm);
  background:rgba(255,255,255,0.04); border:1px solid var(--glass-line);
  color:var(--txt-1); font-size:14px; font-family:var(--ff);
  outline:none; transition:border-color .18s;
}
.login-card input:focus{ border-color: var(--amber); }
.login-card button{
  width:100%; margin-top:14px; padding:13px; border:none; border-radius:var(--r-sm);
  background: linear-gradient(135deg, var(--amber), var(--amber-2));
  color:#1a1206; font-weight:700; font-size:14px; cursor:pointer;
  transition: transform .15s, box-shadow .15s;
}
.login-card button:hover{ transform: translateY(-1px); box-shadow:0 8px 20px rgba(230,160,86,0.3); }
.login-card button:disabled{ opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
.login-err{ margin-top:12px; font-size:13px; color:var(--bad); min-height:16px; }

/* ================================================================
   APP SHELL
================================================================ */
#app{ display:none; min-height:100vh; }
#app.visible{ display:flex; }

.sidebar{
  width:240px; flex-shrink:0; padding:20px 14px; display:flex; flex-direction:column;
  gap:4px; border-right:1px solid var(--glass-line);
  background: var(--bg-1);
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{ display:flex; align-items:center; gap:10px; padding:8px 10px 20px; }
.brand .mark{ width:28px;height:28px;border-radius:8px; background:linear-gradient(135deg,var(--amber),var(--amber-2)); }
.brand span{ font-weight:700; font-size:14px; letter-spacing:.2px; }

.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--r-sm);
  color:var(--txt-2); font-size:13.5px; font-weight:500; cursor:pointer;
  border:1px solid transparent; transition: background .15s, color .15s;
  white-space:nowrap;
}
.nav-item:hover{ background:rgba(255,255,255,0.04); color:var(--txt-1); }
.nav-item.active{
  background: linear-gradient(180deg, var(--glass-strong), var(--glass-mid));
  border-color: var(--glass-line-hi); color:var(--txt-1);
}
.nav-dot{ width:6px;height:6px;border-radius:50%; background:var(--txt-3); }
.nav-item.active .nav-dot{ background:var(--amber); }

.sidebar-foot{ margin-top:auto; padding-top:14px; border-top:1px solid var(--glass-line); }
.logout-btn{
  width:100%; padding:9px; border-radius:var(--r-sm); background:transparent;
  border:1px solid var(--glass-line); color:var(--txt-3); font-size:12.5px; cursor:pointer;
  font-family:var(--ff);
}
.logout-btn:hover{ color:var(--bad); border-color:rgba(248,113,113,0.4); }

.main{ flex:1; min-width:0; }
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px; border-bottom:1px solid var(--glass-line);
  position:sticky; top:0; background:rgba(10,11,13,0.85); backdrop-filter:blur(10px);
  z-index:5;
}
.topbar h2{ font-size:16px; font-weight:700; }
.topbar .meta{ font-size:12px; color:var(--txt-3); font-family:var(--ff-mono); }
.menu-toggle{ display:none; background:none; border:none; color:var(--txt-1); font-size:20px; cursor:pointer; }

.content{ padding:24px 28px 60px; max-width:1400px; }
.section{ display:none; animation: fadeIn .25s ease; }
.section.active{ display:block; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

/* ---------- stat cards ---------- */
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px; }
.stat-card{ padding:18px; }
.stat-card .label{ font-size:12px; color:var(--txt-3); font-weight:500; text-transform:uppercase; letter-spacing:.4px; }
.stat-card .value{ font-size:28px; font-weight:700; margin-top:8px; font-family:var(--ff-mono); }
.stat-card .value.small{ font-size:20px; }

/* ---------- generic table ---------- */
.table-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:13px; }
th{ text-align:left; padding:10px 14px; color:var(--txt-3); font-weight:600; font-size:11.5px;
    text-transform:uppercase; letter-spacing:.3px; border-bottom:1px solid var(--glass-line); white-space:nowrap; }
td{ padding:11px 14px; border-bottom:1px solid rgba(255,255,255,0.04); color:var(--txt-2); white-space:nowrap; }
tr:last-child td{ border-bottom:none; }
td.wrap, th.wrap{ white-space:normal; }
.empty-row td{ text-align:center; padding:32px; color:var(--txt-3); }

/* ---------- badges ---------- */
.badge{ display:inline-block; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:600; }
.badge.live{ background:rgba(52,211,153,0.15); color:var(--good); }
.badge.pending{ background:rgba(251,191,36,0.15); color:var(--warn); }
.badge.approved{ background:rgba(52,211,153,0.15); color:var(--good); }
.badge.rejected{ background:rgba(248,113,113,0.15); color:var(--bad); }

.bar-row{ display:flex; align-items:center; gap:10px; padding:8px 0; }
.bar-row .name{ width:130px; font-size:12.5px; color:var(--txt-2); flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar-track{ flex:1; height:8px; border-radius:99px; background:rgba(255,255,255,0.05); overflow:hidden; }
.bar-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg,var(--amber-2),var(--amber)); }
.bar-count{ width:44px; text-align:right; font-family:var(--ff-mono); font-size:12px; color:var(--txt-3); }

.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media (max-width:900px){ .two-col{ grid-template-columns:1fr; } }

.card-title{ font-size:13px; font-weight:700; padding:16px 16px 4px; }
.card-sub{ font-size:11.5px; color:var(--txt-3); padding:0 16px 12px; }

.rev-card{ padding:16px; margin-bottom:12px; }
.rev-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
.rev-name{ font-weight:700; font-size:13.5px; }
.rev-stars{ color:var(--gold); font-size:12px; }
.rev-text{ font-size:13px; color:var(--txt-2); line-height:1.5; margin-bottom:10px; }
.rev-actions{ display:flex; gap:8px; }
.rev-actions button{ font-family:var(--ff); font-size:12px; font-weight:600; padding:6px 12px; border-radius:8px; border:1px solid var(--glass-line); background:transparent; color:var(--txt-2); cursor:pointer; }
.rev-actions button.approve:hover{ border-color:rgba(52,211,153,0.5); color:var(--good); }
.rev-actions button.reject:hover{ border-color:rgba(248,113,113,0.5); color:var(--bad); }

.status-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
.status-item{ padding:16px; display:flex; align-items:center; gap:12px; }
.status-dot{ width:10px;height:10px;border-radius:50%; }
.status-dot.ok{ background:var(--good); box-shadow:0 0 8px var(--good); }
.status-dot.warn{ background:var(--warn); box-shadow:0 0 8px var(--warn); }

.refresh-note{ font-size:11.5px; color:var(--txt-3); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.dot-pulse{ width:6px;height:6px;border-radius:50%; background:var(--good); animation:pulse 1.6s infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

@media (max-width:860px){
  .sidebar{ position:fixed; left:0; top:0; z-index:50; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 40px rgba(0,0,0,.5); }
  .sidebar.open{ transform:translateX(0); }
  .menu-toggle{ display:block; }
  .content{ padding:18px 16px 60px; }
  .topbar{ padding:14px 16px; }
}
</style>
</head>
<body>

<!-- ============== LOGIN ============== -->
<div id="login-screen">
  <div class="glass login-card">
    <div class="mark">A</div>
    <h1>Admin Access</h1>
    <p>Enter your password to continue</p>
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Sign In</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ============== APP ============== -->
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="mark"></div><span>Analytics</span></div>
    <nav id="navList"></nav>
    <div class="sidebar-foot">
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="menu-toggle" id="menuToggle">&#9776;</button>
        <h2 id="sectionTitle">Overview</h2>
      </div>
      <div class="meta" id="lastUpdated">—</div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script src="dashboard.js" defer></script>
</body>
</html>
